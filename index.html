<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- Чтобы нормально выглядело на телефоне -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Lucky Arcade</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Верхняя часть -->
    <header class="topbar">

      <div>
        <div class="eyebrow">ARCADE</div>
        <h1>Lucky Arcade</h1>
      </div>

      <div class="score-box">
        <span>ОЧКИ</span>
        <strong id="score">0</strong>
      </div>

    </header>

    <!-- Основная игра -->
    <section class="card">

      <div class="status">

        <span id="message">
          Готов? Жми!
        </span>

        <span class="streak">
          Серия: <b id="streak">0</b> 🔥
        </span>

      </div>

      <!-- Барабаны -->
      <div class="reels">

        <div class="reel" id="reel1">
          🍒
        </div>

        <div class="reel" id="reel2">
          ⭐
        </div>

        <div class="reel" id="reel3">
          💎
        </div>

      </div>

      <!-- Кнопка -->
      <button id="playButton" class="play-button">
        ИГРАТЬ
      </button>

      <!-- Таблица очков -->
      <div class="rules">

        <div>
          <span>⭐</span>
          <span>3 одинаковых</span>
          <b>+100</b>
        </div>

        <div>
          <span>💎</span>
          <span>3 одинаковых</span>
          <b>+250</b>
        </div>

        <div>
          <span>🍒</span>
          <span>3 одинаковых</span>
          <b>+150</b>
        </div>

        <div>
          <span>🍀</span>
          <span>3 одинаковых</span>
          <b>+200</b>
        </div>

      </div>

    </section>

    <!-- Статистика -->
    <section class="stats">

      <div class="stat">
        <span>Лучший счёт</span>
        <b id="best">0</b>
      </div>

      <div class="stat">
        <span>Раундов</span>
        <b id="rounds">0</b>
      </div>

    </section>

    <p class="note">
      Аркадная мини-игра без ставок, денег и покупок.
    </p>

  </main>

<script>
const symbols = ["🍒", "⭐", "💎", "🍀", "🍋", "🔔"];

const rewards = {
  "🍒": 150,
  "⭐": 100,
  "💎": 250,
  "🍀": 200,
  "🍋": 120,
  "🔔": 175
};

const reels = [
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
];

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const roundsElement = document.getElementById("rounds");
const streakElement = document.getElementById("streak");
const messageElement = document.getElementById("message");
const playButton = document.getElementById("playButton");

let score = 0;
let best = 0;
let rounds = 0;
let streak = 0;

function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function updateScreen() {
  scoreElement.textContent = score;
  bestElement.textContent = best;
  roundsElement.textContent = rounds;
  streakElement.textContent = streak;
}

function play() {

  if (playButton.disabled) {
    return;
  }

  playButton.disabled = true;

  messageElement.textContent = "Крутим...";

  reels.forEach(function(reel) {
    reel.classList.add("spinning");
  });

  let counter = 0;

  const timer = setInterval(function() {

    reels.forEach(function(reel) {
      reel.textContent = randomSymbol();
    });

    counter++;

    if (counter >= 15) {

      clearInterval(timer);

      const result = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
      ];

      reels.forEach(function(reel, index) {

        reel.classList.remove("spinning");

        reel.textContent = result[index];

      });

      rounds++;

      const win =
        result[0] === result[1] &&
        result[1] === result[2];

      if (win) {

        const reward = rewards[result[0]];

        streak++;

        score += reward;

        if (score > best) {
          best = score;
        }

        messageElement.textContent =
          "Победа! +" + reward + " очков 🎉";

        reels.forEach(function(reel) {
          reel.classList.add("win");
        });

        setTimeout(function() {

          reels.forEach(function(reel) {
            reel.classList.remove("win");
          });

        }, 500);

      } else {

        streak = 0;

        messageElement.textContent =
          "Почти! Попробуй ещё ✨";

      }

      updateScreen();

      setTimeout(function() {
        playButton.disabled = false;
      }, 300);

    }

  }, 80);
}

playButton.addEventListener("click", play);

updateScreen();
</script>
  
</body>
</html>
